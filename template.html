<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap');

@page {
    size: A4;
    margin: 25mm 20mm;
    background-color: #ffffff;
}

body {
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    color: #1a1f1c;
    font-size: 14pt;
    line-height: 1.8;
    background-color: #ffffff;
}

h1, h2, h3, h4 {
    font-family: 'Cinzel', serif;
    color: #1c3628;
    font-weight: 700;
    margin-top: 1.5em;
    margin-bottom: 0.5em;
    page-break-after: avoid;
}

h1 {
    font-size: 32pt;
    text-align: center;
    border-bottom: 2px solid #C8A24A;
    padding-bottom: 12px;
    margin-bottom: 40px;
}

h2 {
    font-size: 24pt;
    border-left: 4px solid #C8A24A;
    background-color: #f7f9f8;
    padding: 10px 16px;
    border-radius: 0 4px 4px 0;
}

h3 {
    font-size: 18pt;
    color: #2c4a38;
}

.kb-entry {
    background-color: #fcfdfc;
    border: 1px solid #e0e5e2;
    border-left: 4px solid #1c3628;
    padding: 25px;
    margin-bottom: 30px;
    border-radius: 6px;
    page-break-inside: avoid;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

a {
    color: #C8A24A;
    text-decoration: none;
    font-weight: 600;
}

code {
    background-color: #e9ecea;
    color: #12241a;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 4px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.1em;
}

pre {
    background-color: #1a1f1c;
    color: #e4e7e5;
    padding: 20px;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 12pt;
}

pre code {
    background-color: transparent;
    color: inherit;
    font-weight: 400;
    padding: 0;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
}

th {
    background-color: #1c3628;
    color: #C8A24A;
    text-align: left;
    padding: 10px;
    font-family: 'Cinzel', serif;
}

td {
    padding: 10px;
    border-bottom: 1px solid #e0e5e2;
}
</style>
</head>
<body>
    <h1>MBK International School<br><span style="font-size: 20pt; color: #5a7364; font-family: 'Inter', sans-serif;">Knowledge Base</span></h1>

    <!-- INJECT ALL CONCATENATED MARKDOWN/HTML CONTENT HERE -->

</body>
</html>
